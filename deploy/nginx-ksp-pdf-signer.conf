# Reverse proxy cho ksp-pdf-signer.a.inut.vn -> app chay o 127.0.0.1:2032
#
# YEU CAU:
#  1) DNS: tao ban ghi A cho ksp-pdf-signer.a.inut.vn tro ve IP cong khai cua
#     may nay. (Hoac wildcard *.a.inut.vn.)
#  2) Chung chi HTTPS: dung certbot (Let's Encrypt):
#     sudo certbot --nginx -d ksp-pdf-signer.a.inut.vn
#  3) Dat PUBLIC_BASE_URL=https://ksp-pdf-signer.p2p.inut.io.vn trong .env (mac dinh
#     da la gia tri nay) de link chia se dung domain.
#  4) Copy file nay vao /etc/nginx/sites-available/ va ln -s sang sites-enabled,
#     roi: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name ksp-pdf-signer.a.inut.vn;
    server_tokens off;
    # certbot se tu chuyen huong 80 -> 443 khi cap chung chi.

    client_max_body_size 50m;

    # API & cong cong khai co CSP theo route tu FastAPI security_middleware (tranh trung lap CSP)
    location ~ ^/(api|webhooks|s|t|khoan)/ {
        proxy_pass http://127.0.0.1:2032;
        proxy_read_timeout 210s;
        proxy_send_timeout 210s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # SPA routes & static assets
    location / {
        proxy_pass http://127.0.0.1:2032;
        proxy_read_timeout 210s;
        proxy_send_timeout 210s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Content-Security-Policy;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob: data:; frame-ancestors 'self'; base-uri 'self'; object-src 'none';" always;
    }
}
