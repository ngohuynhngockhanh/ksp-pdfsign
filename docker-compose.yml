services:
  backend:
    build: ./backend
    env_file: .env
    volumes:
      - ./backend/data:/app/data
      - ./backend/app/trust:/app/app/trust:ro
    environment:
      - DATA_DIR=/app/data
    expose:
      - "8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
