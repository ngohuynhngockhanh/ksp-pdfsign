; Cau hinh Windows Agent. Copy thanh config.ini va chinh cho dung may.
; KHONG commit config.ini len git. Agent se fail closed neu thieu config.ini.

[token]
; Duong dan DLL PKCS#11 cua token WIN-CA tren may Windows.
; Vi du thuong gap:
;   WatchData / mToken : C:\Windows\System32\WDPKCS.dll
;   SafeNet eToken     : C:\Windows\System32\eTPKCS11.dll
pkcs11_lib = C:\Windows\System32\WDPKCS.dll

; Nhan token (de trong = dung token dau tien tim thay)
token_label =

[auth]
; Khoa bi mat rieng cho agent (gui qua header X-Agent-Secret hoac X-Admin-Password).
; Bat buoc tao chuoi ngau nhien >= 32 ky tu (vi du: openssl rand -hex 32).
api_secret = <DAT_AGENT_API_SECRET_NGAU_NHIEN_MANH>

; Danh sach IP / CIDR duoc phep goi agent (chi mo cho IP may chu backend).
allowed_ips = 127.0.0.1,::1,192.168.1.10/32

; Gioi han so lan xac thuc sai truoc khi chan HTTP 429 (mac dinh 5 lan / 60s).
rate_limit_max_failures = 5
rate_limit_window_seconds = 60

; Chi bat true neu can tuong thich cu voi Windows Administrator LogonUser (KHONG khuyen nghi).
allow_windows_logon_fallback = false

[server]
; Agent lang nghe HTTPS tren giao dien LAN noi bo. Xem install-service.md de tao chung chi co SAN IP.
host = 127.0.0.1
port = 8443
